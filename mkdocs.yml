
site_name: HQ Regional DSGE | Research & Policy Lab
site_description: >
  An independent academic research platform for
  regional macroeconomic modelling, DSGE policy
  experiments and economic analysis.

  
nav:
  - Home: index.md
  - About Me: about.md
  - Research: research.md
  - Model: model/setup.md

  - Model Results:
      - Overview: results/index.md
      - II Estimation: results/ii-estimation.md
      - II Specification Tests: results/ii-tests.md
      - Monte Carlo Power Analysis: results/power.md
      - Variance & Historical Decomposition: results/decomposition.md
      - Impulse Response Functions: results/irfs.md

  - Policy Lab: 
      - Interactive Policy Studio: policy/index.md
      - Policy Briefing: policybriefing/index.md
      - Next Steps: policybriefing/next-steps.md
  - Teaching: teaching.md
  - Contact: contact.md

theme:
  name: material
  features:
    # - navigation.expand
    #- navigation.sections
    - navigation.top
    - content.code.copy

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

 




markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/lang-switcher.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js





  
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
